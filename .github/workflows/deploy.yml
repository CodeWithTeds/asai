name: Fast Deploy to Hostinger (ZIP Stream)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  web-deploy:
    name: Build, Package and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Vite Assets
        run: npm run build

      - name: Package Project into deploy.zip
        run: |
          zip -rq deploy.zip . \
            -x ".git*" \
            -x ".github*" \
            -x "node_modules*" \
            -x "tests*" \
            -x ".env*" \
            -x "HOSTINGER_DEPLOYMENT_GUIDE.md" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/data/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      - name: Create Unzip Helper Script
        run: |
          cat << 'EOF' > extract.php
          <?php
          $token = $_GET['token'] ?? '';
          if ($token !== 'asai-deploy-key-2026') {
              http_response_code(403);
              die('Forbidden');
          }

          $zipFile = __DIR__ . '/deploy.zip';
          if (!file_exists($zipFile)) {
              http_response_code(404);
              die('deploy.zip not found');
          }

          $zip = new ZipArchive;
          if ($zip->open($zipFile) === TRUE) {
              $zip->extractTo(__DIR__);
              $zip->close();
              @unlink($zipFile);
              @unlink(__FILE__);
              echo 'DEPLOY_SUCCESS';
          } else {
              http_response_code(500);
              echo 'FAILED_TO_UNZIP';
          }
          EOF

      - name: Upload ZIP Package to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          security: loose
          timeout: 60000
          server-dir: domains/annapolissecurity.ph/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/*
            !deploy.zip
            !extract.php

      - name: Trigger Remote Unzip on Hostinger
        run: |
          echo "Triggering extraction in public_html..."
          RESPONSE=$(curl -s -k "https://annapolissecurity.ph/extract.php?token=asai-deploy-key-2026" || true)
          echo "Response: $RESPONSE"
