name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Package and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Vite Assets
        run: npm run build

      - name: Package Project into deploy.zip
        run: |
          zip -rq deploy.zip . \
            -x ".git*" \
            -x ".github*" \
            -x "node_modules*" \
            -x "tests*" \
            -x ".env*" \
            -x "public/storage/*" \
            -x "storage/app/public/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/data/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      - name: Prepare Remote Extraction Helper
        run: |
          mkdir -p public
          DEPLOY_TOKEN="${{ secrets.DEPLOY_TOKEN }}"
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN secret is not set. Aborting deployment."
            exit 1
          fi
          sed "s/__DEPLOY_TOKEN__/${DEPLOY_TOKEN}/g" .github/scripts/extract.php > public/extract.php
          echo "DEPLOY_TOKEN=${DEPLOY_TOKEN}" >> $GITHUB_ENV

      - name: Upload Files to Hostinger via FTP
        run: |
          # Why -k: Hostinger FTP uses certificates that may not chain to GitHub runner's CA bundle
          CURL_FTP_OPTS="--ssl-reqd --ftp-pasv -k --connect-timeout 45 --retry 5 --retry-delay 5 --retry-all-errors --max-time 600"
          FTP_CREDS="${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
          FTP_BASE="ftp://${{ secrets.FTP_SERVER }}:21/domains/annapolissecurity.ph/public_html"

          echo "Uploading deploy.zip..."
          curl $CURL_FTP_OPTS -T deploy.zip -u "$FTP_CREDS" "${FTP_BASE}/deploy.zip"

          echo "Uploading extract.php..."
          curl $CURL_FTP_OPTS -T public/extract.php -u "$FTP_CREDS" "${FTP_BASE}/public/extract.php"

      - name: Trigger Remote Extraction on Hostinger
        run: |
          echo "Triggering remote extraction..."
          RESPONSE=$(curl -s --connect-timeout 30 --max-time 180 --retry 3 --retry-delay 5 \
            -X POST \
            -d "token=${DEPLOY_TOKEN}" \
            "https://annapolissecurity.ph/extract.php")
          echo "Server Response: $RESPONSE"
          if [[ "$RESPONSE" != *"DEPLOY_SUCCESS"* ]]; then
            echo "::error::Extraction failed. Server responded: $RESPONSE"
            exit 1
          fi
          echo "Deployment completed successfully."
