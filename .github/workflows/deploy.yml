name: Direct Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build, Package and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Vite Assets
        run: npm run build

      - name: Package Project into deploy.zip
        run: |
          zip -rq deploy.zip . \
            -x ".git*" \
            -x ".github*" \
            -x "node_modules*" \
            -x "tests*" \
            -x ".env*" \
            -x "HOSTINGER_DEPLOYMENT_GUIDE.md" \
            -x "asai_export.sql" \
            -x "storage/app/public/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/data/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      - name: Create Unzip Helper Script in public folder
        run: |
          mkdir -p public
          cat << 'EOF' > public/extract.php
          <?php
          $token = $_GET['token'] ?? '';
          if ($token !== 'asai-deploy-key-2026') {
              http_response_code(403);
              die('Forbidden: Invalid Token');
          }

          $targetDir = dirname(__DIR__);
          $zipFile = $targetDir . '/deploy.zip';

          if (!file_exists($zipFile)) {
              $zipFile = __DIR__ . '/deploy.zip';
          }

          if (!file_exists($zipFile)) {
              http_response_code(404);
              die('Error: deploy.zip not found on server');
          }

          // Recover orphaned backup from a previous failed deploy
          $uploadsDir = $targetDir . '/storage/app/public';
          if (!is_dir($uploadsDir)) {
              foreach (glob($targetDir . '/_storage_backup_*') as $orphan) {
                  if (is_dir($orphan)) {
                      @rename($orphan, $uploadsDir);
                      break;
                  }
              }
          }

          $zip = new ZipArchive;
          if ($zip->open($zipFile) === TRUE) {
              $zip->extractTo($targetDir);
              $zip->close();
              @unlink($zipFile);
              @unlink(__FILE__);

              // Create storage symlink if the host supports it
              $publicStorageLink = $targetDir . '/public/storage';
              if (function_exists('symlink') && !file_exists($publicStorageLink) && is_dir($uploadsDir)) {
                  @symlink($uploadsDir, $publicStorageLink);
              }

              // Clear cached route/config files so changes take effect immediately
              foreach (glob($targetDir . '/bootstrap/cache/*.php') as $cachedFile) {
                  @unlink($cachedFile);
              }
              echo 'DEPLOY_SUCCESS';
          } else {
              http_response_code(500);
              die('Error: Failed to extract zip');
          }
          EOF

      - name: Upload Files to Hostinger via cURL FTP
        run: |
          echo "Uploading deploy.zip to Hostinger..."
          curl -k --ssl-reqd -T deploy.zip -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}:21/domains/annapolissecurity.ph/public_html/deploy.zip"
          echo "Uploading public/extract.php to Hostinger..."
          curl -k --ssl-reqd -T public/extract.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}:21/domains/annapolissecurity.ph/public_html/public/extract.php"

      - name: Trigger Remote Unzip on Hostinger
        run: |
          echo "Triggering remote extraction on Hostinger..."
          RESPONSE=$(curl -s -k "https://annapolissecurity.ph/extract.php?token=asai-deploy-key-2026")
          echo "Server Response: $RESPONSE"
          if [[ "$RESPONSE" != *"DEPLOY_SUCCESS"* ]]; then
            echo "ERROR: Extraction did not report DEPLOY_SUCCESS! Got: $RESPONSE"
            exit 1
          fi
